# The button Release: publishes the head of main as a release of Gentry on
# GitHub, by hand, with the version as its only field.
#
#   gh workflow run release.yml --ref main -f version=0.2.0
#
# The checks and the build are made by the program of release of the
# repository, ./cmd/release; the workflow runs it and the tests of CI and
# publishes what it builds. The tag and the release are created only after
# the checks and the tests have passed: the job that publishes needs both,
# with no condition that runs it when one fails. The text of the release is
# the section of the version in CHANGELOG.md and the line with the address
# of the page of the release, which the checks print. The checks build the
# site of the pages of the releases too, with the page of the new version:
# a content of a page written wrong is refused before the tests.
#
# After the release the workflow builds the site of the pages of all the
# releases and publishes it on GitHub Pages, as the button Publish pages,
# pages.yml, does: the release comes first, and a failure of the pages
# leaves it.
#
# After the pages are published the workflow sends the message about the
# release to the group of Gentry in Telegram, from the bot of the group by
# the Bot API. The program of release builds the message in the job that
# publishes, from the section of the version in CHANGELOG.md and the text
# for the group in releases/<version>.md, which the checks check; the last
# job sends it with the secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. A
# failure of the sending leaves the release and the pages, and «Re-run
# failed jobs» sends the message again. The button Publish pages sends no
# message.
name: Выпуск

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия выпуска вида X.Y.Z, например 0.2.0
        required: true
        type: string

permissions:
  contents: read

# One release at a time: a run started during another waits for it and then
# its checks see the tag of the first. GitHub keeps only one waiting run: a
# third run started meanwhile cancels the waiting second one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags are the releases the checks compare with

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # The version comes through the environment, not into the script: it
      # is typed by hand. Each call of the program of release goes through
      # .github/release.sh: a refusal goes to the log of the run as an error.
      - name: release check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          . .github/release.sh
          release check "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

  # The tests of CI on the commit of the release: the same workflow, called.
  tests:
    name: tests
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: [check, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags are the releases the checks compare with
          # The token of this job may write to the repository: it is given to
          # gh by GH_TOKEN, not left in .git/config for the steps that build
          # and run the code of the commit.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # The checks again, on the commit to publish: they give the text of
      # the release.
      - name: release check
        run: |
          . .github/release.sh
          release check "$VERSION" > "$RUNNER_TEMP/notes.md"

      # The message about the release to the group in Telegram, built from
      # the commit of the release in this job, which runs the code of the
      # commit and has no secrets of the bot: the job that sends it has them
      # and runs no code of the commit. It is built before the release is
      # created, so its failure leaves no release.
      - name: release notice
        run: |
          . .github/release.sh
          release notice "$VERSION" > "$RUNNER_TEMP/notice.html"

      # The message is kept 30 days, as long as GitHub lets the jobs of a run
      # be rerun: «Re-run failed jobs» of the job that sends it downloads it
      # within them. overwrite lets a rerun of this job upload the message
      # again under the same name.
      - uses: actions/upload-artifact@v7
        with:
          name: notice
          path: ${{ runner.temp }}/notice.html
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Go stamps the version into the programs from the tag of the commit:
      # the tag is made here for the build only, and the build checks that
      # the program names the version. GitHub creates the tag with the
      # release.
      - name: release build
        run: |
          . .github/release.sh
          git tag "v$VERSION"
          release build "$VERSION" "$RUNNER_TEMP/dist"
          git tag --delete "v$VERSION"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP"/dist/* \
            --target "$GITHUB_SHA" \
            --title "Gentry $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # The site of the pages of the releases, built whole after the release is
  # created from the head of main at the time of the build, not from the
  # commit of the release: a change of releases/<version>.md merged during
  # the release is not undone by its publication. The tag of the release,
  # which the checkout fetches, makes the new version a released one. A
  # failure here leaves the release as it is. The job builds and runs the
  # code of main, as the button Publish pages does, so it may not write to
  # Pages: the next job publishes the site.
  pages:
    name: pages
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0  # the tags are the released versions, the new one too

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: release pages
        run: |
          . .github/release.sh
          release pages "$RUNNER_TEMP/site"

      # The site is kept 7 days for the job deploy: a rerun of its failure
      # publishes it within them.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
          retention-days: 7

  # The publication of the site on GitHub Pages: the only job that may write
  # to Pages, with no checkout of the code. Its failure, such as Pages not
  # turned on, leaves the release; «Re-run failed jobs» publishes the site
  # built within the 7 days it is kept. Later the button Publish pages
  # publishes the pages: it builds the site again.
  #
  # One publication at a time, in the button Release and in the button
  # Publish pages alike: a publication started during another waits for it.
  # The group is of this job, apart from the group of the workflow: a
  # publication waits for a publication only, not for a release.
  deploy:
    name: deploy pages
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # The message about the release to the group of Gentry in Telegram, sent
  # after the pages are published, so the address of the page in it opens.
  # The job has the secrets of the bot and of the group, so it gets no
  # checkout of the code and may only read: it downloads the message the job
  # that publishes has built and sends it as it is. A failure here, such as
  # a refusal of Telegram, fails the job and leaves the release and the
  # pages; «Re-run failed jobs» sends the message again within the 30 days
  # it is kept. When the publication of the pages fails, the job is skipped,
  # and the rerun of the publication runs it after. Telegram has no key
  # against a repeat: a rerun after a message that did arrive, such as one
  # whose answer was lost, sends it once more.
  notify:
    name: telegram
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: notice
          path: ${{ runner.temp }}/notice

      # The secrets come through the environment of this step only. The
      # token is a part of the address of the Bot API: the shell does not
      # trace the commands, so the address with the token is not printed,
      # and GitHub masks the secrets in the log too. The answer of Telegram
      # goes to a file: on a failure the step prints it whole, with the
      # reason of a refusal, and fails; on a message sent it prints only ok
      # and the number of the message. With the shell bash a pipe fails when
      # any of its commands fails: a failure of jq fails the step too.
      - name: send
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ! jq -n --arg chat "$TELEGRAM_CHAT_ID" --rawfile text "$RUNNER_TEMP/notice/notice.html" \
              '{chat_id: $chat, text: $text, parse_mode: "HTML", link_preview_options: {is_disabled: true}}' |
            curl --silent --show-error --fail-with-body \
              -H 'Content-Type: application/json' --data @- \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" > "$RUNNER_TEMP/answer.json"; then
            cat "$RUNNER_TEMP/answer.json" >&2
            exit 1
          fi
          jq '{ok, message_id: .result.message_id}' "$RUNNER_TEMP/answer.json"
