name: CI

on:
  push:
  workflow_dispatch:
  # The button Release runs the same tests on the commit of a release.
  workflow_call:

permissions:
  contents: read

# Called by Release, the workflow has the context github of the caller: the
# name of the workflow keeps its run apart from the run of CI on the same
# branch, so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests run as a matrix of the OS and the suite of tests, a job for
  # each, so the time of a suite reads as the time of the step of its tests.
  # The checks that are not tests run in a job of their own on Linux and
  # Windows. On macOS they run in the job of the unit tests instead: the plan
  # Free runs at most 5 jobs on macOS at once, and a run with a fifth one
  # there would take them all, so that another run waited for it. The
  # timeout leaves room over the longest suite, the acceptance tests on
  # Linux with the areas update and release, and for the slower runners of
  # Windows.
  test:
    name: ${{ matrix.os }} / ${{ matrix.title || matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        suite: [unit, architecture, acceptance, e2e]
        include:
          - os: macos
            suite: unit
            title: unit + checks
            checks: true
          - os: ubuntu
            suite: checks
            checks: true
          - os: windows
            suite: checks
            checks: true
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags give the version Go stamps into the binary

      # The jobs of one OS share the cache of Go: the modules and the build
      # cache. Saved by setup-go, it would be saved by the job that ends
      # first, an almost empty one such as the architecture tests, and every
      # job would build the rest anew until the key changes. So each job only
      # restores it, and the job of the acceptance tests saves it: it builds
      # the dependencies of its OS, sqlite among them, as the unit tests do,
      # the programs of the releases of the area update, and on Linux the
      # builds of gentry for the six platforms of the area release too.
      - uses: ./.github/actions/go
        id: go

      # The unit and integration tests, in short mode: every package of the
      # module but those under tests, which run in the jobs of their suites.
      # A new package of the code, such as contract outside cmd and internal,
      # runs here with no change of the workflow.
      - name: unit tests
        if: matrix.suite == 'unit'
        run: |
          packages=$(go list ./... | grep -v '^github.com/t8nax/gentry/tests/')
          # shellcheck disable=SC2086 # a word per package
          go test -short $packages

      # The checks that are not tests run in the jobs with checks: the format
      # and the generated code do not depend on the OS and are checked on
      # Linux only, go vet, the build and the smoke test on each OS. In the
      # job of macOS they come after the unit tests: go vet before them would
      # build their packages first, and the time of the suite there would not
      # compare with that on the other OS.
      - name: gofmt
        if: matrix.checks && runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: generated code is up to date
        if: matrix.checks && runner.os == 'Linux'
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "go generate changed files; run it and commit the result:"
            git status --porcelain
            git diff
            exit 1
          fi

      # The second run covers the files of the build for the acceptance tests,
      # which only the tag acceptance compiles.
      - name: go vet
        if: matrix.checks
        run: |
          go vet ./...
          go vet -tags acceptance ./cmd/gentry

      - name: architecture tests
        if: matrix.suite == 'architecture'
        run: go test -count=1 ./tests/architecture

      # CI runs the acceptance tests only on a built gentry, in processes of
      # its own, as the commands run in fact. The run in the process of the
      # test gives the same output, exit code and changes and is the faster
      # one on the operator's machine. The tag acceptance adds the entries of
      # the agent and of the tools; with -buildvcs=false the version is that
      # of the test binary.
      - name: build for the acceptance tests
        if: matrix.suite == 'acceptance'
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          bin="$RUNNER_TEMP/acceptance/gentry$(go env GOEXE)"
          go build -tags acceptance -buildvcs=false -o "$bin" ./cmd/gentry
          echo "ACCEPTANCE_BINARY=$bin" >> "$GITHUB_ENV"

      # Areas that call SkipOnBinary need a second pass in the process of
      # the test: on the build they skip, so without it they run nowhere.
      # Discover calls in every Go file, including helpers, so a new area
      # needs no change here. The area release runs on Linux only, where the
      # button Release runs; elsewhere its builds add no coverage. All other
      # areas keep their own platform skips. Both passes are one step, and
      # the second runs after a failed first pass too; either failure makes
      # the step fail.
      - name: acceptance tests
        id: acceptance
        if: matrix.suite == 'acceptance'
        run: |
          status=0
          GENTRY_TEST_BINARY="$ACCEPTANCE_BINARY" go test -count=1 ./tests/acceptance/... || status=$?
          test -d ./tests/acceptance
          areas=()
          for area in ./tests/acceptance/*; do
            [ -d "$area" ] || continue
            if [ "$area" = ./tests/acceptance/release ] && [ "$RUNNER_OS" != Linux ]; then
              continue
            fi
            if grep -rE --include='*.go' '\.SkipOnBinary[[:space:]]*\(' "$area" > /dev/null; then
              areas+=("$area")
            else
              code=$?
              if [ "$code" -ne 1 ]; then
                exit "$code"
              fi
            fi
          done
          if [ "${#areas[@]}" -gt 0 ]; then
            go test -count=1 "${areas[@]}" || status=$?
          fi
          exit "$status"

      # What the job builds does not depend on the result of the tests: the
      # cache is saved when they fail too. It is saved only when the step of
      # the tests has run in full, so that a cache without the builds of the
      # tests, such as after a failed build of gentry, does not take the key
      # until it changes.
      - uses: actions/cache/save@v6
        if: >-
          !cancelled() && matrix.suite == 'acceptance' &&
          steps.go.outputs.cache-hit != 'true' &&
          (steps.acceptance.outcome == 'success' || steps.acceptance.outcome == 'failure')
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

      # Runs the tests of tests/e2e in full (concurrent processes, the MCP
      # server, the hooks and their budget, startup time, the end of the
      # checks of a stage) on one build of gentry; short mode skips them.
      - name: e2e tests
        if: matrix.suite == 'e2e'
        run: go test -count=1 -v ./tests/e2e

      - name: build
        if: matrix.checks
        run: go build -o bin/ ./cmd/gentry

      - name: smoke test
        if: matrix.checks
        run: |
          ./bin/gentry version
          ./bin/gentry version --json
          out=$(./bin/gentry hook session-start)
          if [ -n "$out" ]; then
            echo "hook outside a project printed: $out"
            exit 1
          fi
          go build -o bin/ ./internal/adapter/claude/testdata/fakeclaude
          export GENTRY_HOME="$RUNNER_TEMP/gentry-home" GENTRY_CLAUDE="$PWD/bin/fakeclaude$(go env GOEXE)"
          ./bin/gentry setup claude --json | grep -q '"action":"installed"'
          ./bin/gentry setup claude --json | grep -q '"action":"unchanged"'
          ./bin/gentry events
          if [ -n "$(./bin/gentry events --json)" ] || [ -e "$GENTRY_HOME/state" ]; then
            echo "events without a state store must print nothing and create nothing"
            exit 1
          fi
          test -f "$GENTRY_HOME/integrations/claude/gentry/hooks/hooks.json"
          code=0
          ./bin/gentry no-such-command || code=$?
          if [ "$code" -ne 2 ]; then
            echo "unknown command exited with $code, want 2"
            exit 1
          fi

  build:
    name: build (6 platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags give the version Go stamps into the binary

      # Restores the cache of Go and does not save it: under the same key only
      # the job ubuntu / acceptance saves it, with the builds of the six
      # platforms of the area release, made with the same flags as here.
      - uses: ./.github/actions/go

      - name: cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          table=$(mktemp)
          {
            echo "### Binary size"
            echo
            echo "| Platform | Size, MB |"
            echo "| --- | --- |"
          } >> "$table"
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            out="dist/gentry-$os-$arch$ext"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/gentry
            size=$(stat -c %s "$out")
            awk -v t="$target" -v s="$size" 'BEGIN { printf "| %s | %.1f |\n", t, s / 1048576 }' >> "$table"
          done
          cat "$table"
          cat "$table" >> "$GITHUB_STEP_SUMMARY"
